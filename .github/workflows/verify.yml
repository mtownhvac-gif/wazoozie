name: Verify and export Wazoozie
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:production
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: wazoozie-built-site
          path: dist/
          include-hidden-files: true
          retention-days: 30
